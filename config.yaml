# EviGuard Configuration File - Strict Zero-Tolerance High-Security Profile

system:
  app_name: "EviGuard AI Proctoring System"
  version: "1.0.0"
  log_level: "INFO"
  inference_stride: 3 # Run heavy deep models every 3 frames for smooth 30+ FPS

video:
  source: 0 # 0 for default webcam, or path to video file e.g., "data/sample_exam.mp4"
  width: 640
  height: 480
  fps: 30
  mock_mode: false

detection:
  model_type: "yolov8"
  model_path: "yolov8n.pt"
  imgsz: 320 # Downscaled input tensor size for ultra-low latency inference
  confidence_threshold: 0.32 # General detector baseline
  phone_confidence_threshold: 0.55 # Raised threshold specifically for mobile phones to eliminate false positives
  person_confidence_threshold: 0.50 # Ensures secondary entities are caught
  book_confidence_threshold: 0.40 # Target COCO class 73 (book/paper) threshold
  enable_paper_heuristic: true # White rectangular sheet contour detector on desk
  phone_min_area: 2800.0 # 40x70 pixels minimum area check
  phone_min_w: 35.0
  phone_min_h: 45.0
  phone_min_aspect_ratio: 1.35
  phone_max_aspect_ratio: 2.65 # Eliminates narrow cylindrical objects (inhalers, pens, lip balm)
  iou_threshold: 0.45
  target_classes:
    - "person"
    - "cell phone"
    - "book"
    - "laptop"
  device_classes:
    - "cell phone"
    - "laptop"
  material_classes:
    - "book"
    - "unauthorized paper/notes"

tracking:
  max_disappeared_frames: 30
  iou_distance_threshold: 0.35
  person_conf_threshold: 0.50 # Ensures secondary entities in background/periphery are caught
  person_nms_iou: 0.45 # Strict NMS overlap suppression to prevent double-counting a single student
  min_person_area: 6000.0

pose_gaze:
  enable_pose: true
  enable_gaze: true
  head_pose:
    # Strict limits (in degrees) to catch slight glancing toward adjacent desks
    max_yaw_angle: 16.0
    max_pitch_angle: 14.0
    yaw_limit_left: -16.0
    yaw_limit_right: 16.0
    pitch_limit_down: 14.0 # Catches looking downward at lap/desk materials
    pitch_limit_up: 20.0
    roll_limit: 20.0
  gaze:
    look_away_continuous_frames: 10
    prolonged_gaze_threshold_frames: 45 # >2.0s continuous lookaway triggers CRITICAL_MALPRACTICE
  face_absence:
    absence_frames_threshold: 15 # ~0.5s rapid response on missing face

risk_engine:
  # Score additions per active violation (0 to 100 base scale)
  weights:
    cell_phone: 85.0 # Instant critical alert on detection
    multiple_persons: 80.0 # Instant critical intruder alert
    face_absent: 75.0 # Immediate seat abandonment flag
    prolonged_gaze_malpractice: 85.0 # Sustained >2.0s deviation instant critical alert
    gaze_deviation: 45.0 # Accumulates to breach alert threshold in <1.5s
    head_pose_deviation: 45.0
    suspicious_object: 40.0
    unusual_movement: 20.0

  # Temporal aggregation parameters
  decay_rate: 0.88
  accumulation_rate: 0.55
  
  # Alert Classification Thresholds
  thresholds:
    low_max: 30.0
    medium_max: 70.0
    high_threshold: 70.0 # Triggers evidence recording and critical alert

evidence_recorder:
  output_dir: "data/evidence_clips"
  pre_roll_seconds: 3
  post_roll_seconds: 3
  codec: "mp4v"
  cooldown_seconds: 3

database:
  db_url: "sqlite:///data/eviguard.db"
