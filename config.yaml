# EviGuard Configuration File

system:
  app_name: "EviGuard AI Proctoring System"
  version: "1.0.0"
  log_level: "INFO"
  inference_stride: 3 # Run heavy deep models every 3 frames for smooth 30+ FPS

video:
  source: 0 # 0 for default webcam, or path to video file e.g., "data/sample_exam.mp4"
  width: 640
  height: 480
  fps: 30
  mock_mode: false # If true or if webcam unavailable, generates simulated testing frames

detection:
  model_type: "yolov8" # "yolov8" or "mock"
  model_path: "yolov8n.pt" # Auto-downloaded by ultralytics if not local
  imgsz: 320 # Downscaled input tensor size for ultra-low latency inference
  confidence_threshold: 0.45
  iou_threshold: 0.45
  target_classes:
    - "person"
    - "cell phone"
    - "book"
    - "laptop"
  # Threshold for triggering unauthorized device alert
  device_classes:
    - "cell phone"
    - "laptop"
  material_classes:
    - "book"

tracking:
  max_disappeared_frames: 30
  iou_distance_threshold: 0.5
  expected_candidate_count: 1

pose_gaze:
  enable_pose: true
  enable_gaze: true
  head_pose:
    # Maximum allowed rotation angles before flagging deviation (in degrees)
    yaw_limit_left: -25.0
    yaw_limit_right: 25.0
    pitch_limit_down: -20.0
    pitch_limit_up: 25.0
    roll_limit: 25.0
  gaze:
    look_away_continuous_frames: 15 # ~0.5s at 30fps
  face_absence:
    absence_frames_threshold: 30 # ~1.0s at 30fps

risk_engine:
  # Score additions per active violation (0 to 100 base scale)
  weights:
    cell_phone: 50.0
    multiple_persons: 45.0
    face_absent: 40.0
    head_pose_deviation: 25.0
    gaze_deviation: 20.0
    suspicious_object: 30.0
    unusual_movement: 15.0

  # Temporal aggregation parameters
  decay_rate: 0.92 # Exponential decay factor per frame when no violation
  accumulation_rate: 0.25 # How fast score builds up with persistent violations
  
  # Alert Classification Thresholds
  thresholds:
    low_max: 30.0
    medium_max: 70.0
    high_threshold: 70.0 # Triggers evidence recording and critical alert

evidence_recorder:
  output_dir: "data/evidence_clips"
  pre_roll_seconds: 3 # Seconds of footage captured before the alert
  post_roll_seconds: 3 # Seconds of footage captured after the alert
  codec: "mp4v" # or "avc1" / "XVID"
  cooldown_seconds: 5 # Prevent spamming multiple clips for same ongoing event

database:
  db_url: "sqlite:///data/eviguard.db"
