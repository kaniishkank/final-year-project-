database:
  db_url: sqlite:///data/eviguard.db
detection:
  augment: false
  book_confidence_threshold: 0.15
  confidence_threshold: 0.42
  device_classes:
  - cell phone
  - laptop
  - headphone
  - remote
  enable_clahe: true
  enable_paper_heuristic: true
  imgsz: 640
  iou_threshold: 0.28
  material_classes:
  - book
  - unauthorized paper/notes
  model_path: yolov8m.pt
  model_type: yolo26
  person_confidence_threshold: 0.28
  phone_confidence_threshold: 0.42
  phone_max_aspect_ratio: 4.5
  phone_min_area: 80.0
  phone_min_aspect_ratio: 1.0
  phone_min_h: 8.0
  phone_min_w: 8.0
  target_classes:
  - person
  - cell phone
  - book
  - laptop
  - headphone
  - remote
evidence_recorder:
  codec: mp4v
  cooldown_seconds: 3
  output_dir: data/evidence_clips
  post_roll_seconds: 3
  pre_roll_seconds: 3
pose_gaze:
  enable_gaze: true
  enable_pose: true
  face_absence:
    absence_frames_threshold: 15
  gaze:
    look_away_continuous_frames: 15
    prolonged_gaze_threshold_frames: 60
  hand_signalling:
    enable: true
    hand_signalling_frames: 35
  head_pose:
    max_pitch_angle: 24.0
    max_yaw_angle: 25.0
    pitch_limit_down: 24.0
    pitch_limit_up: 22.0
    roll_limit: 25.0
    yaw_limit_left: -25.0
    yaw_limit_right: 25.0
risk_engine:
  accumulation_rate: 0.55
  decay_rate: 0.88
  thresholds:
    critical_min: 75.0
    high_threshold: 70.0
    monitor_max: 50.0
    normal_max: 25.0
    suspicious_max: 75.0
  weights:
    cell_phone: 95.0
    face_absent: 85.0
    gaze_deviation: 35.0
    hand_signalling: 65.0
    head_pose_deviation: 35.0
    multiple_persons: 90.0
    smart_watch: 85.0
    suspicious_downward_gaze: 65.0
    unauthorized_notes: 90.0
system:
  app_name: EviGuard AI Proctoring System
  inference_stride: 3
  log_level: INFO
  version: 1.0.0
tracking:
  iou_distance_threshold: 0.35
  max_disappeared_frames: 30
  min_person_area: 6000.0
  min_person_distance: 150.0
  person_conf_threshold: 0.5
  person_nms_iou: 0.45
video:
  fps: 30
  height: 480
  mock_mode: false
  source: 0
  width: 640
